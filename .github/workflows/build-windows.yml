
name: Build Cello Trainer for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Windows executable
        run: |
          python -m PyInstaller --clean --windowed --name CelloTrainer cello_trainer_v6.5.py

      - name: Package Windows executable
        run: |
          Compress-Archive -Path dist\CelloTrainer\* -DestinationPath dist\CelloTrainer-Windows-v6.5.2.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CelloTrainer-Windows-v6.5.2
          path: dist/CelloTrainer-Windows-v6.5.2.zip
          if-no-files-found: error
