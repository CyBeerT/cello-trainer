
name: Build Cello Trainer for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --clean \
            --windowed \
            --name CelloTrainer \
            cello_trainer_v6.5.2.py

      - name: Package macOS app
        run: |
          cd dist
          zip -r CelloTrainer-macOS-v6.5.2.zip CelloTrainer.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CelloTrainer-macOS-v6.5.2
          path: dist/CelloTrainer-macOS-v6.5.2.zip
          if-no-files-found: error
